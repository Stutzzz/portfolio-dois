<script>
  window.addEventListener("load", function () {
    const preloader = document.getElementById("preloader");
    const logo = document.querySelector("#preloader img");

    // Mostra a logo com fade-in após 0.5s
    setTimeout(() => {
      logo.classList.add("logo-show");
    }, 500);

    // Logo some após 2.5s (0.5s + 2s visível)
    setTimeout(() => {
      logo.classList.remove("logo-show");
      logo.classList.add("logo-hide");
    }, 1500);

    // Fundo some depois da logo (3.5s total)
    setTimeout(() => {
      preloader.classList.add("fade-out");
    }, 2500);

    // Remove totalmente após a transição do fundo
    setTimeout(() => {
      preloader.style.display = "none";
    }, 3500);
  });
</script>

  #preloader {
    position: fixed;
    top: 0;
    left: 0;

    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 1;
    transition: opacity 1s ease-in-out;
  }

  #preloader.fade-out {
    opacity: 0;
  }

  #preloader img {
    width: 250px;
    opacity: 0;
    transition: opacity 1s ease;
  }

  #preloader img.logo-show {
    opacity: 1;
  }

  #preloader img.logo-hide {
    opacity: 0;

		#preloader img {

}
